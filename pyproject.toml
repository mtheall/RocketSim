[project]
name            = "RocketSim"
version         = "2.2.1"
description     = "This is Rocket League!"
dependencies    = ["numpy"]
requires-python = ">= 3.9"

[build-system]
requires      = ["cmeel[build]", "numpy>=2.0,<3"]
build-backend = "cmeel"
backend-path  = ["."]

[tool.cmeel]
run-tests = false

[tool.cibuildwheel]
build = "cp39-*"
skip = "*-musllinux*"
